apply plugin: 'com.android.application'

// Version from package.json (1.2.3 → versionCode 10203), so web and apps share one number.
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def (vMajor, vMinor, vPatch) = pkg.version.tokenize('.-').take(3).collect { it.toInteger() }

// Release signing: android/keystore.properties (never committed), or environment variables in CI.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def hasReleaseKey = signingValue('storeFile', 'OPTIC_KEYSTORE') != null

android {
    namespace = "in.techbysh.optic"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.techbysh.optic"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // WASM and model files are already compressed or must be memory-mappable.
    androidResources {
        noCompress += ['wasm']
    }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "optic-${variant.versionName}-${variant.buildType.name}.apk" }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(signingValue('storeFile', 'OPTIC_KEYSTORE'))
                storePassword signingValue('storePassword', 'OPTIC_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'OPTIC_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'OPTIC_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Without a release key the APK is signed with the debug key (still installable).
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
